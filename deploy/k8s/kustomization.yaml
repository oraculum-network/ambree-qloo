# The app's manifests (k3s + Traefik). Rendered with `kubectl kustomize deploy/k8s`.
# Create the namespace `qloo` first, with your cluster's own policies (Pod Security, network
# policies, quota). The Secret qloo-api comes from deploy/store-key.sh; until it exists the app
# runs in demo mode.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: qloo
labels:
  - pairs:
      app.kubernetes.io/part-of: ambree-qloo
      app.kubernetes.io/managed-by: oraculum-deploy
resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
# The image is built on the host by the deploy gate as oraculum/ambree-qloo:<sha7>. The deploy
# renders this dir through an overlay that sets newTag to that sha (DEPLOY.md step 3);
# `set-by-deploy` as it stands would fail with ErrImageNeverPull, never run a stale image.
images:
  - name: oraculum/ambree-qloo
    newTag: set-by-deploy
