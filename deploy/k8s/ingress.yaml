# HTTPS only (websecure), with a Let's Encrypt certificate from Traefik's `le` resolver;
# no `tls:` stanza: Traefik's router.tls annotation turns TLS on and the resolver supplies
# the certificate. Set your own host below (the hosted demo, qloo.ambree.ai, is retired).
#
# ORDER: the host's DNS record must resolve publicly BEFORE the first apply: Traefik tries
# a certificate once and doesn't retry a failed one on its own.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qloo-web
  labels:
    app.kubernetes.io/name: ambree-qloo
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: le
spec:
  ingressClassName: traefik
  rules:
    - host: qloo.ambree.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qloo-web
                port:
                  name: http
