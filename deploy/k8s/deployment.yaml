# One small Node pod (the MCP server and the demo page). Stateless: nothing on disk, so the
# root filesystem is read-only and a restart loses only the in-memory caches and the day's
# budget counters. The label app.kubernetes.io/name: ambree-qloo is what the namespace's
# NetworkPolicies select (in from Traefik on :8080, out to DNS and public :443).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qloo-web
  labels:
    app.kubernetes.io/name: ambree-qloo
    app.kubernetes.io/component: web
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app.kubernetes.io/name: ambree-qloo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ambree-qloo
        app.kubernetes.io/component: web
    spec:
      priorityClassName: qloo-low
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # Built on the host by the deploy gate (`build ambree-qloo <sha7>`); the tag is the
          # 7-char commit sha, set in kustomization.yaml at deploy time (DEPLOY.md step 3).
          image: oraculum/ambree-qloo
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: HOST
              value: "0.0.0.0"
            - name: PUBLIC_ORIGIN
              value: https://qloo.ambree.ai
            # Traefik appends the real client IP to X-Forwarded-For; the rate limiter takes
            # the right-most entry.
            - name: TRUST_PROXY_HOPS
              value: "1"
            # Set QLOO_DAILY_CALLS to Qloo's real quota once it is published.
            - name: QLOO_DAILY_CALLS
              value: "3000"
            - name: QLOO_CLIENT_DAILY_CALLS
              value: "300"
            # The parked seam: no Secret (or no key in it) means demo mode, so the pod still boots.
            - name: QLOO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: qloo-api
                  key: QLOO_API_KEY
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 192Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
